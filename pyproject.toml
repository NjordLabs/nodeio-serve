[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]

[project]
name = "nodeio-serve"
version = "0.2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]
requires-python = ">=3.13"
authors = [{name = "pirlruc"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
description = "HTTP and gRPC ingress for a nodeio graph"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
grpc = [
  "grpcio>=1.85.3",
  "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
  "bandit[toml]==1.9.4",
  "coverage[toml]>=7.13.5",
  "httpx>=0.28",
  "hypothesis>=6.140",
  "interrogate>=1.7.0",
  "mypy>=1.20.2",
  "pip-audit>=2.9",
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "radon>=6.0.1",
  "ruff==0.15.12",
]

[project.urls]
Repository = "https://github.com/NjordLabs/nodeio-serve"

[tool.bandit]
exclude_dirs = [
  ".github",
  ".venv",
  "build",
  "dist",
  "docs",
  "scripts",
  "src/nodeio_serve/_gen",
  "tests",
]

[tool.coverage.run]
branch = true
omit = ["*/nodeio_serve/_gen/*"]
source = ["nodeio_serve"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.interrogate]
exclude = ["src/nodeio_serve/_gen"]
fail-under = 95
ignore-nested-classes = true
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true

[tool.mypy]
disallow_untyped_defs = true
exclude = ["(^|/)docs/", "(^|/)\\.github/", "^scripts/", "(^|/)tests/"]
explicit_package_bases = true
mypy_path = ["src", "typings"]
namespace_packages = true
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[[tool.mypy.overrides]]
ignore_errors = true
module = "nodeio_serve._gen.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["grpc", "grpc.*"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "hypothesis"

[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = "tests.test_codec_properties"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
ignore-paths = ["^src/nodeio_serve/_gen/"]
ignore-patterns = ["\\.pyi$"]
py-version = "3.13"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
]

[tool.ruff]
extend-exclude = ["src/nodeio_serve/_gen"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D", "DOC"]
"tests/**" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
nodeio_serve = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

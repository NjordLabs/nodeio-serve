repo: NjordLabs/nodeio-serve

milestones:
  - name: Phase 1 — Foundation
    epics:
      - id: SERVE-001
        status: open
        title: Serve one graph run over HTTP and gRPC
        overview:
          problem: >-
            A graph run had no ingress with a body cap, a concurrency
            limit, or a health route.
          goal: >-
            One HTTP application and one gRPC servicer share a handler,
            and an example image is built and scanned without being
            published.
        decision: >-
          In the context of a request-shaped graph, facing an
          unbounded upload, we decided a body cap and a concurrency
          limit in a separate package, to achieve an ingress that
          does not change the engine, accepting that the image is an
          example and is not published.
        acceptance_criteria:
          - Health and run routes exist
          - A body over the cap is rejected
          - Concurrent runs are bounded
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SERVE-001-T1
            status: done
            title: Implement the ingress and the example image
            instructions:
              files:
                - src/nodeio_serve/app.py
                - src/nodeio_serve/grpc.py
                - Dockerfile
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T2
            status: open
            title: Publish to PyPI with a trusted publisher
            instructions:
              files:
                - .github/workflows/publish-pypi.yml
            verification:
              - Pending publisher for NjordLabs/nodeio-serve, workflow .github/workflows/publish-pypi.yml, environment pypi
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T3
            status: done
            title: Run the test job on Python 3.14
            instructions:
              files:
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T4
            status: done
            title: Add a repo-level container CI script
            instructions:
              files:
                - scripts/check-ci-docker.sh
            verification:
              - sh scripts/check-ci-docker.sh
            guardrail_refs:
              - PY-TEST-002
      - id: SERVE-002
        status: done
        title: Serve the run method from a generated stub
        overview:
          problem: >-
            The gRPC ingress is a hand-written servicer. It is not a
            stub generated from the proto.
          goal: >-
            A generated grpcio.aio server implements the same Run method.
        decision: >-
          In the context of the first ingress, facing a hand-written
          servicer, we decided to generate the grpcio.aio server from
          the proto and share the HTTP concurrency limit, to achieve
          one Run method, accepting an optional grpc extra.
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SERVE-002-T1
            status: done
            title: Generate the grpcio.aio server from the proto
            instructions:
              files:
                - src/nodeio_serve/grpc.py
                - proto/nodeio/v1/graph.proto
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002

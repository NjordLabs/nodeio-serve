repo: NjordLabs/nodeio-serve

milestones:
  - name: Phase 1 — Foundation
    epics:
      - id: SERVE-001
        status: open
        title: Serve one graph run over HTTP and gRPC
        overview:
          problem: >-
            A graph run had no ingress with a body cap, a concurrency
            limit, or a health route.
          goal: >-
            One HTTP application and one gRPC servicer share a handler,
            and an example image is built and scanned without being
            published.
        decision: >-
          In the context of a request-shaped graph, facing an
          unbounded upload, we decided a body cap and a concurrency
          limit in a separate package, to achieve an ingress that
          does not change the engine, accepting that the image is an
          example and is not published.
        acceptance_criteria:
          - Health and run routes exist
          - A body over the cap is rejected
          - Concurrent runs are bounded
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SERVE-001-T1
            status: done
            title: Implement the ingress and the example image
            instructions:
              files:
                - src/nodeio_serve/app.py
                - src/nodeio_serve/grpc.py
                - Dockerfile
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T2
            status: open
            title: Publish to PyPI with a trusted publisher
            instructions:
              files:
                - .github/workflows/publish-pypi.yml
            verification:
              - Pending publisher for NjordLabs/nodeio-serve, workflow .github/workflows/publish-pypi.yml, environment pypi
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T3
            status: done
            title: Run the test job on Python 3.14
            instructions:
              files:
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
          - id: SERVE-001-T4
            status: done
            title: Add a repo-level container CI script
            instructions:
              files:
                - scripts/check-ci-docker.sh
            verification:
              - sh scripts/check-ci-docker.sh
            guardrail_refs:
              - PY-TEST-002
      - id: LAYOUT-001
        status: done
        title: Keep hand-written modules in the scanned package
        overview:
          problem: >-
            Hand-written modules lived under a directory the quality
            tools skipped, next to generated stubs.
          goal: >-
            Hand-written code is scanned. Generated stubs are excluded
            by an explicit path.
        decision: >-
          In the context of the ingress package, facing a skipped
          directory, we decided to move hand-written modules into the
          package and declare the generated tree, to achieve a real
          scan, accepting a generated-path input.
        acceptance_criteria:
          - jsonio and state are package modules
          - generated stubs live under _gen
          - the quality workflow passes generated_paths
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: LAYOUT-001-T1
            status: done
            title: Move modules and declare the generated path
            instructions:
              files:
                - src/nodeio_serve/jsonio.py
                - src/nodeio_serve/grpc.py
                - .github/workflows/ci-quality.yml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: PIN-001
        status: done
        title: Pin guardrails 1.17.1 and hash the container install
        overview:
          problem: >-
            The repository still cited guardrails 1.15.0, and the container
            install did not pin dependency hashes.
          goal: >-
            Pins match the current org tags, dev tools live in a dependency
            group, and the container install requires hashes.
        decision: >-
          In the context of the org quality bar, facing a stale pin, we
          decided to move to guardrails 1.17.1 and hash the container
          install, to achieve the current gates, accepting a lock refresh.
        acceptance_criteria:
          - docs/guardrails is 1.17.1 and .github/scaffold is 1.14.3
          - Dev tools are a dependency group
          - The container install uses --require-hashes
        guardrail_refs:
          - SC-DEP-008
        tasks:
          - id: PIN-001-T1
            status: done
            title: Bump the pins and hash the container install
            instructions:
              files:
                - scripts/check-ci-docker.sh
                - pyproject.toml
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - SC-DEP-008
      - id: SERVE-002
        status: done
        title: Serve the run method from a generated stub
        overview:
          problem: >-
            The gRPC ingress is a hand-written servicer. It is not a
            stub generated from the proto.
          goal: >-
            A generated grpcio.aio server implements the same Run method.
        decision: >-
          In the context of the first ingress, facing a hand-written
          servicer, we decided to generate the grpcio.aio server from
          the proto and share the HTTP concurrency limit, to achieve
          one Run method, accepting an optional grpc extra.
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SERVE-002-T1
            status: done
            title: Generate the grpcio.aio server from the proto
            instructions:
              files:
                - src/nodeio_serve/grpc.py
                - proto/nodeio/v1/graph.proto
            verification:
              - sh scripts/check-ci-local.sh
            guardrail_refs:
              - PY-TEST-002
      - id: SERVE-003
        status: done
        title: Pass GHCR_READ_TOKEN into container lint
        overview:
          problem: >-
            The Quality workflow already logs in to GHCR with
            GHCR_READ_TOKEN. The Container workflow does not. Its lint job
            turns off infra lint and the secrets scan because those jobs
            pull private ghcr.io/pirlruc/ci-lint with github.token.
          goal: >-
            Once container-lint.yml forwards a registry login, the Container
            workflow passes GHCR_READ_TOKEN and runs both scans.
        decision: >-
          In the context of the example image, facing scans left off for a
          private ci-lint pull, we decided to pass the existing
          GHCR_READ_TOKEN as container_token with username pirlruc, to
          achieve the same pull the Quality job already makes, accepting
          that a Dependabot run still skips the secret.
        acceptance_criteria:
          - container.yml passes container_username pirlruc and GHCR_READ_TOKEN
          - run_infra_lint and run_secrets_scan are on
          - The containerdevops pin is one that forwards container_token
        guardrail_refs:
          - CI-028
          - CI-024
        tasks:
          - id: SERVE-003-T1
            status: done
            title: Send GHCR_READ_TOKEN from the container lint job
            instructions:
              files:
                - .github/workflows/container.yml
            verification:
              - rg -n "GHCR_READ_TOKEN" .github/workflows/container.yml
              - "! rg -n 'run_infra_lint: false' .github/workflows/container.yml"
            guardrail_refs:
              - CI-028
              - CI-024

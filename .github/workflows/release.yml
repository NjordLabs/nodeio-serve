name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/pydevops/.github/workflows/python-release.yml@ce31af67d4b236e42298e9ba6f2984e60ab4ddff

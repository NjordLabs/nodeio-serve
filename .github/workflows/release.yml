name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/pydevops/.github/workflows/python-release.yml@8b0d7d083c04057c9bc04d3f93db44561925fe59 # 3.11.3

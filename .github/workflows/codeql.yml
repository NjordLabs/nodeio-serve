name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-codeql.yml@ce31af67d4b236e42298e9ba6f2984e60ab4ddff
    with:
      queries: security-extended

    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-buf.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5
    with:
      scripts_ref: ff65e7efbb7eea67bd659f886db0adb399f3a3f5
      blocking: true

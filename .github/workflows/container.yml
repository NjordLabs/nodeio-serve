name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@4d5c00e20786811f740b70ee9d46832fc979f126
    with:
      image_name: nodeio-serve:local
      scripts_ref: 4d5c00e20786811f740b70ee9d46832fc979f126
      push_handoff: false
      scan_local: true
      image_title: nodeio-serve
      image_description: HTTP and gRPC ingress for a nodeio graph

  lint:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@4d5c00e20786811f740b70ee9d46832fc979f126
    with:
      scripts_ref: 4d5c00e20786811f740b70ee9d46832fc979f126
      blocking: true
      # Nested infra and secrets jobs pull private ghcr.io/pirlruc/ci-lint.
      # This repo's token cannot read that package. Dockerfile lint still runs.
      # Secret scanning stays on the quality workflow.
      run_infra_lint: false
      run_secrets_scan: false

name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b1cf0dead2b1a501bf1433fe72cdbbdad4e9132d # 6.10.0
    with:
      image_name: nodeio-serve:local
      scripts_ref: b1cf0dead2b1a501bf1433fe72cdbbdad4e9132d
      push_handoff: false
      scan_local: true
      image_title: nodeio-serve
      image_description: HTTP and gRPC ingress for a nodeio graph

  lint:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@b1cf0dead2b1a501bf1433fe72cdbbdad4e9132d # 6.10.0
    with:
      scripts_ref: b1cf0dead2b1a501bf1433fe72cdbbdad4e9132d
      blocking: true
      container_username: pirlruc
    secrets:
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
